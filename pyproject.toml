[project]
name = "ai-orgdesign"
version = "0.1.0"
description = "AI engineering and organisation design: learning workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jupyterlab>=4.4,<5",
  "ipykernel>=6.29,<8",
  "nbformat>=5.10,<6",
  "nbclient>=0.10,<1",
  "python-dotenv>=1.1,<2",
  "torch>=2.6,<3",
  "transformers>=4.50,<5",
  "scikit-learn>=1.6,<2",
  "langgraph>=1,<2",
  "mcp>=1.20,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "openai>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["examples/01-foundations", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
