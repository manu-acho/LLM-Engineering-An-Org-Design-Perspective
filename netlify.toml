[build]
  command = "node browser-reader/scripts/build.mjs"
  publish = "browser-reader/dist"

[build.environment]
  NODE_VERSION = "24"

# The reader uses hash navigation, so lesson links do not need SPA rewrites.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"

[[headers]]
  for = "/content-index.json"
  [headers.values]
    Cache-Control = "no-store"
